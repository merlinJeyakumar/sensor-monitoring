[versions]
kotlin = "2.4.20"
akka = "2.10.22"
akka-http = "10.7.5"
serialization = "1.11.0"
config = "1.4.9"
slf4j = "2.0.20"
logback = "1.6.4"
junit = "6.1.3"

[libraries]
akka-bom = { module = "com.typesafe.akka:akka-bom_2.13", version.ref = "akka" }
akka-actor-typed = { module = "com.typesafe.akka:akka-actor-typed_2.13" }
akka-stream = { module = "com.typesafe.akka:akka-stream_2.13" }
akka-slf4j = { module = "com.typesafe.akka:akka-slf4j_2.13" }
akka-http = { module = "com.typesafe.akka:akka-http_2.13", version.ref = "akka-http" }
akka-testkit = { module = "com.typesafe.akka:akka-actor-testkit-typed_2.13" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
typesafe-config = { module = "com.typesafe:config", version.ref = "config" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

