name: sensor-monitoring
services:
  central:
    build: .
    command: central
    healthcheck:
      test: ["CMD", "/app/bin/sensor-monitoring", "central", "--health-check"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      HTTP_BIND_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 20s
    mem_limit: 384m
    cpus: 1
  warehouse-a:
    build: .
    command: warehouse
    healthcheck:
      test: ["CMD", "/app/bin/sensor-monitoring", "warehouse", "--health-check"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      WAREHOUSE_ID: warehouse-a
      UDP_BIND_ADDRESS: 0.0.0.0
      CENTRAL_ENDPOINT: http://central:8080/readings
    ports:
      - "127.0.0.1:3344:3344/udp"
      - "127.0.0.1:3355:3355/udp"
    depends_on:
      central:
        condition: service_healthy
    stop_grace_period: 20s
    mem_limit: 384m
    cpus: 1
  warehouse-b:
    build: .
    command: warehouse
    healthcheck:
      test: ["CMD", "/app/bin/sensor-monitoring", "warehouse", "--health-check"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      WAREHOUSE_ID: warehouse-b
      UDP_BIND_ADDRESS: 0.0.0.0
      CENTRAL_ENDPOINT: http://central:8080/readings
    ports:
      - "127.0.0.1:4344:3344/udp"
      - "127.0.0.1:4355:3355/udp"
    depends_on:
      central:
        condition: service_healthy
    stop_grace_period: 20s
    mem_limit: 384m
    cpus: 1
