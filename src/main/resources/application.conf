warehouse {
  id = ${?WAREHOUSE_ID}
  bind-address = "127.0.0.1"
  bind-address = ${?UDP_BIND_ADDRESS}
  temperature-port = 3344
  temperature-port = ${?TEMPERATURE_PORT}
  humidity-port = 3355
  humidity-port = ${?HUMIDITY_PORT}
  health-port = 8081
  health-port = ${?HEALTH_PORT}
  central-endpoint = "http://127.0.0.1:8080/readings"
  central-endpoint = ${?CENTRAL_ENDPOINT}
  max-datagram-bytes = 512
  max-datagram-bytes = ${?MAX_DATAGRAM_BYTES}
  capacity = 1024
  capacity = ${?PENDING_CAPACITY}
  max-in-flight = 8
  max-in-flight = ${?MAX_IN_FLIGHT}
  attempt-timeout = 2s
  attempt-timeout = ${?REQUEST_TIMEOUT}
  max-attempts = 3
  max-attempts = ${?MAX_ATTEMPTS}
  max-event-age = 30s
  max-event-age = ${?MAX_EVENT_AGE}
  drain-timeout = 10s
  drain-timeout = ${?SHUTDOWN_TIMEOUT}
}
central {
  bind-address = "127.0.0.1"
  bind-address = ${?HTTP_BIND_ADDRESS}
  port = 8080
  port = ${?HTTP_PORT}
  temperature-threshold = 35
  temperature-threshold = ${?TEMPERATURE_THRESHOLD}
  humidity-threshold = 50
  humidity-threshold = ${?HUMIDITY_THRESHOLD}
  capacity = 64
  capacity = ${?CENTRAL_CAPACITY}
  body-limit = 2048
  body-limit = ${?HTTP_BODY_LIMIT}
  request-timeout = 2s
  request-timeout = ${?REQUEST_TIMEOUT}
  drain-timeout = 10s
  drain-timeout = ${?SHUTDOWN_TIMEOUT}
}
akka.loglevel = "WARNING"
akka.actor.default-dispatcher.fork-join-executor {
  parallelism-min = 2
  parallelism-max = 4
}
akka.http.server.request-timeout = 3s
akka.http.server.parsing.max-content-length = 2048
akka.jvm-shutdown-hooks = off
